apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: openshift-encrypted-cmk-sc-lab-placement
  namespace: acm-config
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: aro_cmk_sc_override
              operator: DoesNotExist
            - key: environment
              operator: In
              values:
                - lab
            - key: cloud
              operator: In
              values:
                - Azure
