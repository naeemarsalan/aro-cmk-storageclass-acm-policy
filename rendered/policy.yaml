apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: openshift-encrypted-cmk-sc-lab-placement
  namespace: acm-config
spec:
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - key: aro_cmk_sc_override
          operator: DoesNotExist
        - key: environment
          operator: In
          values:
          - lab
        - key: cloud
          operator: In
          values:
          - Azure
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-openshift-encrypted-cmk-sc-lab-policy
  namespace: acm-config
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: openshift-encrypted-cmk-sc-lab-placement
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: openshift-encrypted-cmk-sc-lab-policy
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    policy.open-cluster-management.io/categories: Platform
    policy.open-cluster-management.io/controls: storage
    policy.open-cluster-management.io/description: Creates the default CMK-encrypted
      Azure Disk StorageClass (DES discovered per cluster) and removes the stock managed-csi
      StorageClass on ARO.
    policy.open-cluster-management.io/standards: ocp-standard
  name: openshift-encrypted-cmk-sc-lab-policy
  namespace: acm-config
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: aro-cmk-storageclass
      spec:
        evaluationInterval:
          compliant: 10m
          noncompliant: 60s
        object-templates-raw: |
          {{- $des := "" }}
          {{- range (lookup "machine.openshift.io/v1beta1" "Machine" "openshift-machine-api" "").items }}
          {{-   if eq $des "" }}
          {{-     $des = dig "spec" "providerSpec" "value" "osDisk" "managedDisk" "diskEncryptionSet" "id" "" . }}
          {{-   end }}
          {{- end }}
          {{- if eq $des "" }}
          {{-   fail "no diskEncryptionSet found on openshift-machine-api Machines; was the cluster created with --disk-encryption-set?" }}
          {{- end }}
          - complianceType: musthave
            recreateOption: IfRequired   # StorageClass parameters are immutable
            objectDefinition:
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: managed-csi-encrypted-cmk
                annotations:
                  storageclass.kubernetes.io/is-default-class: "true"
              provisioner: disk.csi.azure.com
              parameters:
                diskEncryptionSetID: '{{ $des }}'
                diskEncryptionType: EncryptionAtRestWithPlatformAndCustomerKeys
                kind: Managed
                storageaccounttype: Premium_ZRS
              reclaimPolicy: Delete
              allowVolumeExpansion: true
              volumeBindingMode: WaitForFirstConsumer
        remediationAction: enforce
        severity: medium
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: openshift-encrypted-cmk-sc-lab-policy
      spec:
        evaluationInterval:
          compliant: 10m
          noncompliant: 60s
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: operator.openshift.io/v1
            kind: ClusterCSIDriver
            metadata:
              name: disk.csi.azure.com
            spec:
              storageClassState: Removed
          recreateOption: IfRequired
        remediationAction: enforce
        severity: medium
  remediationAction: enforce
