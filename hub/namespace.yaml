apiVersion: v1
kind: Namespace
metadata:
  name: acm-config
---
# Lets Placements in acm-config select clusters from the "global" set.
# Swap for your own ManagedClusterSet if you scope ARO clusters separately.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: acm-config
spec:
  clusterSet: global
